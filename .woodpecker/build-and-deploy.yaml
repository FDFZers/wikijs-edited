# .woodpecker.yml
variables:
  - &base_dev_version "2.5.314-edited"

when:
  branch: main
  event: [push, manual]

steps:
  # ── 设置版本号 ──
  set-version:
    image: alpine
    commands:
      - apk add --no-cache jq
      - |
        REL_VERSION="v${BASE_DEV_VERSION}-dev.${CI_PIPELINE_NUMBER}"
        REL_VERSION_STRICT="${BASE_DEV_VERSION}-dev.${CI_PIPELINE_NUMBER}"
        echo "Using version: $REL_VERSION"
        echo "REL_VERSION=$REL_VERSION" >> .env
        echo "REL_VERSION_STRICT=$REL_VERSION_STRICT" >> .env
        mv package.json pkg-temp.json
        jq --arg vs "$REL_VERSION_STRICT" -r '. + {dev:false, version:$vs}' pkg-temp.json > package.json
        rm pkg-temp.json
        cat package.json
    environment:
      BASE_DEV_VERSION: *base_dev_version

  # ── 构建并加载到本地 Docker ──
  build:
    image: docker
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - |
        . .env
        echo "Building image: fdfzers/wikijs-edited:${REL_VERSION_STRICT}"
        docker build \
          -t fdfzers/wikijs-edited:latest \
          -t fdfzers/wikijs-edited:${REL_VERSION_STRICT} \
          -f Dockerfile .
        echo "IMAGE_TAG=${REL_VERSION_STRICT}" >> .env
        docker images fdfzers/wikijs-edited

  deploy:
    image: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - |
        . .env
        COMPOSE_FILE="/opt/1panel/apps/wikijs/ffwiki/docker-compose.yml"
        IMAGE_NAME="fdfzers/wikijs-edited:${IMAGE_TAG}"

        # 用 sed 替换 image 字段
        sed -i "s|image:.*|image: ${IMAGE_NAME}|" $COMPOSE_FILE

        # 重启服务
        cd $(dirname $COMPOSE_FILE)
        docker compose pull 2>/dev/null || true
        docker compose up -d --force-recreate
        docker compose ps

        echo "=== 部署完成 ==="
        docker compose logs --tail=20
