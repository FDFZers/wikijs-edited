variables:
  - &base_dev_version "2.5.314"

when:
  branch: main
  event: [push, manual]

steps:
  set-version:
    image: alpine
    commands:
      - apk add --no-cache jq
      - |
        REL_VERSION="${BASE_DEV_VERSION}-edited.${CI_PIPELINE_NUMBER}"
        mv package.json pkg-temp.json
        jq --arg vs "$REL_VERSION" -r '. + {dev:false, version:$vs}' pkg-temp.json > package.json
        rm pkg-temp.json
        cat package.json
    environment:
      BASE_DEV_VERSION: *base_dev_version

  # ── 构建并加载到本地 Docker ──
  build:
    image: docker
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - |
        REL_VERSION="${BASE_DEV_VERSION}-edited.${CI_PIPELINE_NUMBER}"
        docker build \
          -t fdfzers/wikijs-edited:latest \
          -t fdfzers/wikijs-edited:${REL_VERSION} \
          -f Dockerfile .
        docker images fdfzers/wikijs-edited

  deploy:
    image: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - |
        REL_VERSION="${BASE_DEV_VERSION}-edited.${CI_PIPELINE_NUMBER}"
        COMPOSE_FILE="/opt/1panel/apps/wikijs/ffwiki/docker-compose.yml"
        IMAGE_NAME="fdfzers/wikijs-edited:${REL_VERSION}"

        sed -i "s|image:.*|image: ${IMAGE_NAME}|" $COMPOSE_FILE

        cd $(dirname $COMPOSE_FILE)
        docker compose pull 2>/dev/null || true
        docker compose up -d --force-recreate
        docker compose ps

        docker compose logs --tail=20
